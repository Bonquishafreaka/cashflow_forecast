[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cashflow-forecast"
version = "0.1.0"
description = "Invoice-level cash-flow forecasting for SMBs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["cashflow_forecast*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
